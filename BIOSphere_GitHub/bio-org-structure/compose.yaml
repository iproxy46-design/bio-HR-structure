services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bio_org
      POSTGRES_USER: bioapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioapp -d bio_org"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://bioapp:${POSTGRES_PASSWORD}@postgres:5432/bio_org
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.dev.vars
        target: /app/.dev.vars
        read_only: true
        bind:
          create_host_path: false
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/org').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
